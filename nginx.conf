    upstream app {
    server main_server:8080;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m inactive=24h max_size=1g;

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;

    server_name 217.16.20.177;

    ssl_protocols TLSv1.2;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MYSESSIONS:10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

    ssl_certificate /etc/ssl/certs/filmlk.crt;
    ssl_certificate_key /etc/ssl/private/filmlk.key;

    location /static/ {
        alias /home/ubuntu/project_kinopoisk/frontend/hakaton-dev/2025_1_sigmaScript/public/static;
        add_header Cache-Control "public, max-age=31536000";
        autoindex on;
    }

    location ~ ^/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }

    location / {
        root /var/www/dist;
        index index.html index.htm index.nginx-debian.html;
        try_files $uri $uri/ /index.html;
    }
}